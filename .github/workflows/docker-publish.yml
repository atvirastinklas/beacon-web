name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [at/dev]

permissions:
  contents: read

concurrency:
  group: publish-at-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    if: github.repository == 'atvirastinklas/beacon-web' && github.ref == 'refs/heads/at/dev'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: validate
    if: github.repository == 'atvirastinklas/beacon-web' && github.ref == 'refs/heads/at/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate downstream image tag
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-at.${GITHUB_SHA:0:12}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=beacon-web
            org.opencontainers.image.description=Beacon Web: real-time LoRa mesh packet analyzer
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update at-dev alias for the current branch tip
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/at/dev | cut -f1)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "Branch has advanced; keeping this build's versioned tag without updating at-dev."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:at-dev" "$IMAGE@$DIGEST"
